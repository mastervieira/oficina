# Release: ao empurrar uma tag vX.Y.Z (igual à versão do pom, sem -SNAPSHOT) testa, gera os instaladores de cada
# sistema, junta-os com SHA256SUMS e latest.properties (o ficheiro que a aplicação consulta) numa release do GitHub.
# Passos e segredos (assinatura): ver RELEASE.md.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: A tag tem de ser igual à versão do pom
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSAO_POM=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          if [ "v${VERSAO_POM}" != "$TAG" ]; then
            echo "A tag $TAG não corresponde à versão do pom ($VERSAO_POM). Use: mvn versions:set -DnewVersion=X.Y.Z" >&2
            exit 1
          fi
      - name: Compilar e testar
        run: mvn -B verify
      - name: Análise estática (SpotBugs + FindSecBugs)
        run: mvn -B -Psecurity -DskipTests compile spotbugs:check

  pacotes:
    needs: testes
    strategy:
      fail-fast: false
      matrix:
        include:
          - { so: ubuntu-24.04, rotulo: linux-x64,   tipo: deb, extensao: deb }
          - { so: windows-2025, rotulo: windows-x64, tipo: msi, extensao: msi }
          - { so: macos-26-intel, rotulo: macos-x64,   tipo: dmg, extensao: dmg }
          - { so: macos-26,       rotulo: macos-arm64, tipo: dmg, extensao: dmg }
    runs-on: ${{ matrix.so }}
    timeout-minutes: 45
    env:
      # A aplicação consulta este ficheiro ao arrancar: está na release mais recente (ver o job "publicar")
      URL_ATUALIZACOES: https://github.com/${{ github.repository }}/releases/latest/download/latest.properties
      # Segredos de assinatura: opcionais; sem eles os pacotes saem sem assinatura (ver RELEASE.md)
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGNING_NAME: ${{ secrets.MACOS_SIGNING_NAME }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Ferramentas do Linux (fakeroot para o .deb)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fakeroot

      - name: WiX no PATH (o jpackage usa-o para o .msi)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "${WIX}bin" >> "$GITHUB_PATH"

      - name: macOS - importar o certificado de assinatura
        if: runner.os == 'macOS' && env.MACOS_CERT_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/assinatura.keychain-db"
          SENHA=$(openssl rand -hex 24)
          security create-keychain -p "$SENHA" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$SENHA" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/certificado.p12"
          security import "$RUNNER_TEMP/certificado.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/certificado.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$SENHA" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          echo "KEYCHAIN_ASSINATURA=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Gerar o pacote
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          TIPO: ${{ matrix.tipo }}
          ROTULO: ${{ matrix.rotulo }}
          EXTENSAO: ${{ matrix.extensao }}
        run: |
          EXTRA=()
          if [ "$RUNNER_OS" = macOS ] && [ -n "${KEYCHAIN_ASSINATURA:-}" ]; then
            EXTRA=(--mac-sign --mac-signing-keychain "$KEYCHAIN_ASSINATURA" --mac-signing-key-user-name "$MACOS_SIGNING_NAME")
          fi
          # os testes já correram no job "testes" (só em Linux): aqui só se empacota
          scripts/empacotar.sh --tipo "$TIPO" --sem-testes -- ${EXTRA[@]+"${EXTRA[@]}"}
          mv dist/*."$EXTENSAO" "dist/Oficina-${TAG#v}-$ROTULO.$EXTENSAO"

      - name: Windows - assinar o instalador
        if: runner.os == 'Windows' && env.WINDOWS_CERT_PFX != ''
        shell: bash
        run: |
          echo "$WINDOWS_CERT_PFX" | base64 --decode > "$RUNNER_TEMP/certificado.pfx"
          SIGNTOOL=$(ls -d "/c/Program Files (x86)/Windows Kits/10/bin/"*/x64/signtool.exe | sort -V | tail -1)
          for f in dist/*.msi; do
            "$SIGNTOOL" sign /f "$(cygpath -w "$RUNNER_TEMP/certificado.pfx")" /p "$WINDOWS_CERT_PASSWORD" \
              /fd sha256 /tr http://timestamp.digicert.com /td sha256 "$(cygpath -w "$f")"
            "$SIGNTOOL" verify /pa "$(cygpath -w "$f")"
          done
          rm -f "$RUNNER_TEMP/certificado.pfx"

      - name: macOS - notarizar
        if: runner.os == 'macOS' && env.MACOS_CERT_P12 != '' && env.APPLE_ID != ''
        run: |
          for f in dist/*.dmg; do
            xcrun notarytool submit "$f" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
            xcrun stapler staple "$f"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pacote-${{ matrix.rotulo }}
          path: dist/Oficina-*
          if-no-files-found: error

  publicar:
    needs: pacotes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # só este job cria a release
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: pacotes
          pattern: pacote-*
          merge-multiple: true
      - name: Somas de verificação e latest.properties
        run: |
          cd pacotes
          sha256sum Oficina-* > SHA256SUMS
          # O que a aplicação consulta: versão e página (https) onde descarregar.
          printf 'versao=%s\npagina=https://github.com/%s/releases/tag/%s\n' "${TAG#v}" "$GITHUB_REPOSITORY" "$TAG" > latest.properties
          ls -la
      - name: Criar a release
        run: |
          # Versões com sufixo (1.2.0-rc1) ficam como pré-lançamento: não são a "latest", logo ninguém é avisado delas.
          PRE=()
          case "$TAG" in *-*) PRE=(--prerelease) ;; esac
          gh release create "$TAG" pacotes/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --title "Oficina ${TAG#v}" ${PRE[@]+"${PRE[@]}"}
